<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<style>
.card{animation:up .7s ease backwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.sweep{transform-origin:1000px 210px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{opacity:.3;animation:blip 6s ease-out infinite}
@keyframes blip{0%{opacity:.15}8%{opacity:1}40%{opacity:.3}100%{opacity:.15}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.card,.sweep,.blip,.pulse{animation:none}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2a78d6" stop-opacity="0"/><stop offset="1" stop-color="#2a78d6" stop-opacity=".35"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="#fcfcfb"/>
<rect x=".5" y=".5" width="1199" height="419" rx="24" fill="none" stroke="#e1e0d9"/>
