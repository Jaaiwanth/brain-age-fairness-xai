<text x="60" y="146" font-size="56" font-weight="800" fill="#0b0b0b" letter-spacing="-1.5">Right for the</text>
<text x="60" y="206" font-size="56" font-weight="800" fill="#0b0b0b" letter-spacing="-1.5">Wrong Reasons?</text>
<text x="60" y="250" font-size="20" fill="#52514e">Auditing a brain-age deep network beyond accuracy.</text>
<g class="card" style="animation-delay:0.35s" transform="translate(60,300)"><rect width="160" height="78" rx="12" fill="#ffffff" stroke="#e1e0d9"/><text x="16" y="38" font-size="26" font-weight="700" fill="#0b0b0b">3.71 yrs</text><text x="16" y="60" font-size="12.5" fill="#898781">test error (MAE)</text></g><g class="card" style="animation-delay:0.53s" transform="translate(232,300)"><rect width="160" height="78" rx="12" fill="#ffffff" stroke="#e1e0d9"/><text x="16" y="38" font-size="26" font-weight="700" fill="#0b0b0b">0</text><text x="16" y="60" font-size="12.5" fill="#898781">detectable sex gap</text></g><g class="card" style="animation-delay:0.71s" transform="translate(404,300)"><rect width="160" height="78" rx="12" fill="#ffffff" stroke="#e1e0d9"/><text x="16" y="38" font-size="26" font-weight="700" fill="#0b0b0b">−5.1 yrs</text><text x="16" y="60" font-size="12.5" fill="#898781">IOP brain-age offset</text></g><g class="card" style="animation-delay:0.89s" transform="translate(576,300)"><rect width="160" height="78" rx="12" fill="#ffffff" stroke="#e1e0d9"/><text x="16" y="38" font-size="26" font-weight="700" fill="#0b0b0b">91%</text><text x="16" y="60" font-size="12.5" fill="#898781">scanner read from features</text></g>
<circle cx="1000" cy="210" r="60" fill="none" stroke="#e1e0d9" stroke-width="1"/><circle cx="1000" cy="210" r="100" fill="none" stroke="#e1e0d9" stroke-width="1"/><circle cx="1000" cy="210" r="140" fill="none" stroke="#e1e0d9" stroke-width="1"/><circle cx="1000" cy="210" r="180" fill="none" stroke="#e1e0d9" stroke-width="1"/>
<path class="sweep" d="M1000 210 L1180 210 A180 180 0 0 0 1155.9 120 Z" fill="url(#g)"/>
<circle class="blip" style="animation-delay:0.2s" cx="925" cy="140" r="6" fill="#2a78d6"/><circle class="blip" style="animation-delay:1.1s" cx="1085" cy="175" r="6" fill="#eb6834"/><circle class="blip" style="animation-delay:2.0s" cx="1040" cy="300" r="6" fill="#1baf7a"/><circle class="blip" style="animation-delay:2.9s" cx="960" cy="265" r="6" fill="#2a78d6"/><circle class="blip" style="animation-delay:3.6s" cx="1110" cy="250" r="6" fill="#eb6834"/><circle class="blip" style="animation-delay:4.4s" cx="890" cy="205" r="6" fill="#1baf7a"/>
<circle cx="1000" cy="210" r="46" fill="#ffffff" stroke="#c3c2b7"/>
<text class="pulse" x="1000" y="207" text-anchor="middle" font-size="22" font-weight="800" fill="#0b0b0b">Partly.</text>
<text x="1000" y="228" text-anchor="middle" font-size="11" fill="#898781">the verdict</text>
<g font-size="12.5" fill="#52514e"><circle cx="905" cy="398" r="5" fill="#2a78d6"/><text x="915" y="402">Guys</text>
