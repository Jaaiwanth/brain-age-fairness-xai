<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" width="1200" height="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1200" height="494" rx="20" fill="#0d0d0d"/><rect x=".5" y=".5" width="1199" height="493" rx="20" fill="none" stroke="#2c2c2a"/>
<text x="24" y="44" font-size="14" letter-spacing="2.5" fill="#898781">THE AUDIT SCORECARD</text>
<g><rect x="24" y="66" width="1152" height="72" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><circle cx="58" cy="102" r="17" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="109" text-anchor="middle" font-size="19" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="97" font-size="21" font-weight="700" fill="#f0efec">Accurate</text><text x="90" y="122" font-size="17" fill="#c3c2b7">Test MAE 3.71 yrs, r 0.966 (test set used once).</text></g><g><rect x="24" y="148" width="1152" height="72" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><circle cx="58" cy="184" r="17" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="191" text-anchor="middle" font-size="19" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="179" font-size="21" font-weight="700" fill="#f0efec">Fair across sex</text><text x="90" y="204" font-size="17" fill="#c3c2b7">No difference in brain-age gap, error or attribution.</text></g><g><rect x="24" y="230" width="1152" height="72" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><circle cx="58" cy="266" r="17" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="273" text-anchor="middle" font-size="19" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="261" font-size="21" font-weight="700" fill="#f0efec">Faithful heatmaps, honest uncertainty</text><text x="90" y="286" font-size="17" fill="#c3c2b7">Pass randomisation + deletion tests; uncertainty doubles where it should.</text></g><g><rect x="24" y="312" width="1152" height="72" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><circle cx="58" cy="348" r="17" fill="#e66767" fill-opacity=".15"/><text x="58" y="355" text-anchor="middle" font-size="19" font-weight="800" fill="#e66767">✕</text><text x="90" y="343" font-size="21" font-weight="700" fill="#f0efec">Acquisition-invariant</text><text x="90" y="368" font-size="17" fill="#c3c2b7">Site read from features at 91%; scan look alone shifts age 3–4 yrs.</text></g><g><rect x="24" y="394" width="1152" height="72" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><circle cx="58" cy="430" r="17" fill="#eda100" fill-opacity=".15"/><text x="58" y="437" text-anchor="middle" font-size="19" font-weight="800" fill="#eda100">?</text><text x="90" y="425" font-size="21" font-weight="700" fill="#f0efec">IOP offset explained</text><text x="90" y="450" font-size="17" fill="#c3c2b7">−5.1 yrs, replicated; not intensity, not blur, not the feature fingerprint.</text></g></svg>