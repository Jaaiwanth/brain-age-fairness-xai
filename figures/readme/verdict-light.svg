<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1200" height="410" rx="20" fill="#fcfcfb"/><rect x=".5" y=".5" width="1199" height="409" rx="20" fill="none" stroke="#e1e0d9"/>
<text x="24" y="44" font-size="14" letter-spacing="2.5" fill="#898781">THE AUDIT SCORECARD</text>
<g><rect x="24" y="70" width="1152" height="56" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="98" r="15" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="104" text-anchor="middle" font-size="17" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="104" font-size="17" font-weight="700" fill="#0b0b0b">Accurate</text><text x="480" y="104" font-size="14.5" fill="#52514e">Test MAE 3.71 yrs, r 0.966 (test set used once).</text></g><g><rect x="24" y="136" width="1152" height="56" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="164" r="15" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="170" font-size="17" font-weight="700" fill="#0b0b0b">Fair across sex</text><text x="480" y="170" font-size="14.5" fill="#52514e">No difference in brain-age gap, error or attribution.</text></g><g><rect x="24" y="202" width="1152" height="56" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="230" r="15" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="236" text-anchor="middle" font-size="17" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="236" font-size="17" font-weight="700" fill="#0b0b0b">Faithful heatmaps, honest uncertainty</text><text x="480" y="236" font-size="14.5" fill="#52514e">Pass randomisation + deletion tests; uncertainty doubles where it should.</text></g><g><rect x="24" y="268" width="1152" height="56" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="296" r="15" fill="#d03b3b" fill-opacity=".15"/><text x="58" y="302" text-anchor="middle" font-size="17" font-weight="800" fill="#d03b3b">✕</text><text x="90" y="302" font-size="17" font-weight="700" fill="#0b0b0b">Acquisition-invariant</text><text x="480" y="302" font-size="14.5" fill="#52514e">Site read from features at 91%; scan look alone shifts age 3–4 yrs.</text></g><g><rect x="24" y="334" width="1152" height="56" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="362" r="15" fill="#c98500" fill-opacity=".15"/><text x="58" y="368" text-anchor="middle" font-size="17" font-weight="800" fill="#c98500">?</text><text x="90" y="368" font-size="17" font-weight="700" fill="#0b0b0b">IOP offset explained</text><text x="480" y="368" font-size="14.5" fill="#52514e">−5.1 yrs, replicated; not intensity, not blur, not the feature fingerprint.</text></g></svg>