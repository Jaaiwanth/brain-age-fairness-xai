<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 576" width="1200" height="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1200" height="576" rx="20" fill="#fcfcfb"/><rect x=".5" y=".5" width="1199" height="575" rx="20" fill="none" stroke="#e1e0d9"/>
<text x="24" y="44" font-size="14" letter-spacing="2.5" fill="#898781">THE AUDIT SCORECARD</text>
<g><rect x="24" y="66" width="1152" height="72" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="102" r="17" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="109" text-anchor="middle" font-size="19" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="97" font-size="21" font-weight="700" fill="#0b0b0b">Accurate</text><text x="90" y="122" font-size="17" fill="#52514e">Test MAE 3.71 yrs, r 0.966 (test set used once).</text></g><g><rect x="24" y="148" width="1152" height="72" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="184" r="17" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="191" text-anchor="middle" font-size="19" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="179" font-size="21" font-weight="700" fill="#0b0b0b">Fair across sex</text><text x="90" y="204" font-size="17" fill="#52514e">Errors and brain-age gaps equivalent within ±2 yrs (412 cross-validated subjects).</text></g><g><rect x="24" y="230" width="1152" height="72" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="266" r="17" fill="#0ca30c" fill-opacity=".15"/><text x="58" y="273" text-anchor="middle" font-size="19" font-weight="800" fill="#0ca30c">✓</text><text x="90" y="261" font-size="21" font-weight="700" fill="#0b0b0b">Faithful heatmaps</text><text x="90" y="286" font-size="17" fill="#52514e">Pass randomisation, deletion (two baselines) and Integrated Gradients checks.</text></g><g><rect x="24" y="312" width="1152" height="72" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="348" r="17" fill="#d03b3b" fill-opacity=".15"/><text x="58" y="355" text-anchor="middle" font-size="19" font-weight="800" fill="#d03b3b">✕</text><text x="90" y="343" font-size="21" font-weight="700" fill="#0b0b0b">Acquisition-invariant</text><text x="90" y="368" font-size="17" fill="#52514e">Site read from features at 91%; scan look alone shifts HH/IOP brains 3–4 yrs.</text></g><g><rect x="24" y="394" width="1152" height="72" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="430" r="17" fill="#d03b3b" fill-opacity=".15"/><text x="58" y="437" text-anchor="middle" font-size="19" font-weight="800" fill="#d03b3b">✕</text><text x="90" y="425" font-size="21" font-weight="700" fill="#0b0b0b">Fair across sites</text><text x="90" y="450" font-size="17" fill="#52514e">IOP −5.2 yrs, robust to age, present before fine-tuning; no tested cause explains it.</text></g><g><rect x="24" y="476" width="1152" height="72" rx="12" fill="#ffffff" stroke="#e1e0d9"/><circle cx="58" cy="512" r="17" fill="#d03b3b" fill-opacity=".15"/><text x="58" y="519" text-anchor="middle" font-size="19" font-weight="800" fill="#d03b3b">✕</text><text x="90" y="507" font-size="21" font-weight="700" fill="#0b0b0b">Calibrated uncertainty</text><text x="90" y="532" font-size="17" fill="#52514e">Own 90% ranges cover 77% at IOP; per-site conformal intervals restore 92%.</text></g></svg>